  wheat: 0.5
  carrot: 0.5
  potato: 0.5
  sugar_cane: 0.5
  oak_log: 0.5
  log: 0.4
  default: 0.25
excluded-items:
  - air
  - command_block
  - repeating_command_block
  - chain_command_block
  - structure_block
  - jigsaw
  - barrier
  - light
  - structure_void
