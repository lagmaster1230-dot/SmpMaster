# Explicit entries override automatic pricing. Prices are per single item.
# Most vanilla survival items/blocks can be sold using auto-prices or default-sell.
default-buy: 0
# Fallback sell value for unlisted vanilla items, blocks and drops.
default-sell: 0.25
# First matching keyword wins; use lowercase item-name fragments and prices per item.
auto-prices:
  netherite_upgrade_smithing_template: 600
  netherite_ingot: 400
  netherite: 250
  elytra: 1000
  nether_star: 500
  beacon: 2000
  ancient_debris: 150
  totem_of_undying: 200
  trident: 150
  diamond_sword: 70
  diamond_pickaxe: 90
  diamond: 40
  emerald: 25
  shulker: 25
  gold_ingot: 4
  gold: 2
  iron_ingot: 2
  iron: 1
  copper: 0.75
